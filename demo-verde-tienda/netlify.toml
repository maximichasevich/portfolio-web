# Configuración de Netlify para este proyecto.
# En Netlify, la "Base directory" es el nombre de esta carpeta.

[build]
  command = "npm run build"
  publish = ".next"

# Adaptador oficial de Next.js para Netlify (funciones de servidor, imágenes,
# acciones de servidor). Netlify lo instala solo; no va en package.json.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Los encabezados de seguridad (CSP, HSTS, etc.) están en next.config.ts:
# en Netlify las páginas de Next.js se sirven con funciones y a esas
# respuestas no se les aplican los encabezados de este archivo.

# La dirección de Netlify lleva siempre al dominio propio.
[[redirects]]
  from = "https://michasevich-verdetienda.netlify.app/*"
  to = "https://verdetienda.michasevich.com/:splat"
  status = 301
  force = true
