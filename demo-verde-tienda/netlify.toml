# Configuración de Netlify para este proyecto.
# En Netlify, poné como "Base directory" el nombre de esta carpeta.
# Netlify detecta Next.js y aplica su adaptador automáticamente.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Cabeceras de seguridad básicas para todas las páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
